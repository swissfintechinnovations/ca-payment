openapi: 3.0.0
info:
  version: 6.0.0
  title: Common Payment API
  description: |
    This specification defines a payment API for the payment types used in Switzerland.
    It is intended for software components that submit payment instructions on behalf of customers to a bank. The further processing of
    submitted payments, including any approval and execution steps, lies within the responsibility of the bank and is out of scope of
    this specification. Consents and Strong Customer Authentication (SCA) are handled in a dedicated specification file.

    Functionally, the API is aligned with the Swiss Payment Standards (SPS) and follows the "Swiss Implementation Guidelines for
    Customer-Bank Messages, Credit Transfer" (pain.001.001.09) for the submission and the "Swiss Implementation Guidelines for
    Status Report" (pain.002.001.10) for the submission status.
    Both the JSON and the ISO 20022 XML representations align with these guidelines. The JSON representation is a defined subset of
    ISO 20022 covering the essentials for API-driven interaction.

    Submission status is reported on group level for the overall submission and on instruction level for individual payments.
    The applicable status values, report levels and possible status sequences are defined in the SPS Implementation Guidelines for
    Status Report, in particular Annex B (Status sequences of pain.002).

    This specification uses schema definitions from the Common Data Model v1.2.1.
  termsOfService: Tbd
  contact:
    email: info@common-api.ch
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: payment.common-api.ch/api/v6
externalDocs:
  description: Find out more about SFTI API specifications.
  url: https://www.common-api.ch
tags:
  - name: payments
    description: |
      Third party payment service considering bulk payments operations (JSON). PUT operation can be used for both payment submission and
      payment initiation (PSS/pss), depending on security implementation.
  - name: single payments
    description: |
      Third party payment service considering single payments operations (JSON). PUT operation can be used for both payment submission and
      payment initiation (PSS/pss), depending on security implementation.
  - name: standing orders
    description: Third party payment service considering standing order operations (JSON).
  - name: iso20022
    description: |
      Third party payment service considering pain.001 and pain.002 operations (XML). PUT operation can be used for both payment submission
      and payment initiation (PSS/pss), depending on security implementation.
  - name: accounts
    description: Third party access to bank account information.
  - name: event subscription
    description: |
      Event subscription operations in the context of OAuth2 consent authentication. One subscription is bound to exactly
      one consent and supports create, retrieve, update and delete operations. Multiple event types are managed within the single
      subscription resource.
  - name: event notification aggregated polling
    description: |
      Aggregated polling operations in the context of Service User authentication, used for catch-up retrieval of event notifications.
      Consists of an optional search step to identify subscriptions with pending events, followed by retrieval of the actual notifications.
security:
  - OAuth2:
      - read
      - write

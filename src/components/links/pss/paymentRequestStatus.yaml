operationId: getPaymentRequestStatus
description: |
  Processing status of the submitted payment request.
  The `submissionId` returned in the response can be used as the `submissionId` path parameter.

  Example: `GET /payments/618d4ac6e8a64e3d9f26aa3d8c4f323e/status`
parameters:
  submissionId: $response.body#/submissionId

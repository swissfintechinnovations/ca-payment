operationId: getIso20022PaymentInstruction
description: |
  The submitted ISO20022 XML pain.001 message.
  The `submissionId` returned in the response can be used as the `submissionId` path parameter.

  Example: `GET /iso20022/payments/618d4ac6e8a64e3d9f26aa3d8c4f323e`
parameters:
  submissionId: $response.body#/submissionId

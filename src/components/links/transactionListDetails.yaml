operationId: getAccountTransaction
description: |
  Details of a single entry. `entryId` corresponds to `AccountTransactionEntry.accountServicerReference`; the
  `accountServicerReference` inside `transactions[]` identifies an individual transaction within an entry and must not be used here.
  The expression below addresses the first entry; it applies to every entry alike.

  Example: `/accounts/550e8400-e29b-11d4-a716-446655440000/transactions/12345ABC6789`
parameters:
  accountId: '$request.path.accountId'
  entryId: '$response.body#/entries/0/accountServicerReference'

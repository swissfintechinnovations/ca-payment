operationId: deleteSinglePaymentRequest
description: |
  Delete the submitted single payment.
  The `submissionId` returned in the response can be used as the `submissionId` path parameter.

  Example: `/single-payments/618d4ac6e8a64e3d9f26aa3d8c4f323e`
parameters:
  submissionId: '$response.body#/submissionId'

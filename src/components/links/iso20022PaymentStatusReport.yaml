operationId: getIso20022PaymentInstructionStatusReport
description: |
  ISO20022 XML pain.002 status report of the submitted message.
  The `submissionId` returned in the response can be used as the `submissionId` path parameter.

  Example: `/iso20022/payments/618d4ac6e8a64e3d9f26aa3d8c4f323e/status`
parameters:
  submissionId: '$response.body#/submissionId'

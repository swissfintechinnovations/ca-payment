operationId: getIso20022AccountStatement
description: |
  The `id` of any entry in the `statements` array can be used as the `reportId` path parameter.
  The expression below addresses the first entry; it applies to every entry alike.
  Example: /iso20022/statements/9262f10b-43ca-46eb-bd2e-16378b0784eb
parameters:
  reportId: '$response.body#/statements/0/id'
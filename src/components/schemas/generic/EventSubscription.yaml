EventSubscription:
  type: object
  required:
    - eventTypes
  properties:
    eventSubscriptionId:
      $ref: '#/components/schemas/EventSubscriptionId'
    eventTypes:
      type: array
      items:
        type: string
        enum:
          - Order:Created
          - Order:Partially_Filled
      example:
        - Order:Created
        - Order:Partially_Filled
    callbackUrl:
      type: string
      example: https://ttp.com/API/notifications/order-placement/
      description: Not to be used in bLink

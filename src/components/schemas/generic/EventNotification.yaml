EventNotification:
  type: object
  properties:
    version:
      type: string
      example: '1.0'
    eventType:
      type: string
      example: accounts:listUpdated
    eventSubscriptionId:
      $ref: .components/schemas/generic/EventNotificationId.yaml
    resourceLink:
      type: string
      example: /api/bankingservices/b-link/account-information-service/v7/accounts
    createdAt:
      type: string
      example: 2022-10-26T07:58:30.996+0100
    id:
      $ref: .components/schemas/generic/EventNotificationId.yaml

title: Account Transaction Remittance Reference
description: The remittance reference of the account transaction. Specifies the structured reference.
type: object
required:
  - reference
  - type
properties:
  reference:
    type: string
    maxLength: 35
    description: |
      The reference number associated to the chosen remittance type. Corresponds to the attribute _RmtInf ⇾ Strd ⇾ CdtrRefInf ⇾ Ref_ in SPS/ISO-20022.
    example: '210000000003139471430009017'
  type:
    type: string
    enum:
      - SCOR
      - ISR
      - QRR
    description: The reference type (QRR, SCOR, ISR). Corresponds to the attribute _RmtInf ⇾ Strd ⇾ CdtrRefInf ⇾ Tp_ in SPS/ISO-20022.
    example: SCOR
  issuer:
    type: string
    maxLength: 35
    description: |
      The Issuer of the reference. The value "ISO" indicates a reference according to the ISO 11649 (RF Creditor Reference) pattern.
      Corresponds to the attribute _RmtInf ⇾ Strd ⇾ CdtrRefInf ⇾ Tp ⇾ Issr_ in SPS/ISO-20022.
    example: ISO

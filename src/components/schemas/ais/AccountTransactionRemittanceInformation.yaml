title: Account Transaction Remittance Information
description: |
  Information that enables the matching of a payment with the items it is intended to settle. Either `unstructured` or `structured`
  (or both) may be present. Corresponds to the attribute _TxDtls ⇾ RmtInf_ in SPS/ISO-20022.
type: object
properties:
  unstructured:
    type: array
    description: |
      Unstructured, free text remittance information. Corresponds to the attribute _RmtInf ⇾ Ustrd_ in SPS/ISO-20022.
    items:
      type: string
      maxLength: 140
      example: Rechnung Nr. 408
  structured:
    type: array
    description: |
      Structured remittance information. Multiple occurrences are allowed (SPS 2026 / CBPR+ 2026), e.g. several references on one entry.
      Corresponds to the attribute _RmtInf ⇾ Strd_ in SPS/ISO-20022.
    items:
      $ref: ./AccountTransactionStructuredRemittance.yaml

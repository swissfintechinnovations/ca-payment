title: Account Transaction Remittance Information
description: The remittance information of the account transaction. Corresponds to the attribute _RmtInf_ in SPS/ISO-20022.
type: object
properties:
  unstructured:
    type: array
    description: The unstructured remittance information. Corresponds to the attribute _RmtInf ⇾ Ustrd_ in SPS/ISO-20022.
    items:
      type: string
      maxLength: 140
      example: Invoice No. 408
  structured:
    type: array
    description: |
      The structured remittance information. This element is defined as an array to allow multiple occurrences in the future.
      Currently, only a single occurrence is provided. Corresponds to the attribute RmtInf ⇾ Strd in SPS/ISO-20022.
    items:
      $ref: ./AccountTransactionStructuredRemittance.yaml

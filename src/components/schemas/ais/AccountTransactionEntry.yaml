title: Account Transaction Entry
description: The account transaction entry object.
type: object
required:
  - accountServicerReference
  - additionalEntryInformation
  - amount
  - bankTransactionCode
  - bookingDate
  - entryStatus
  - transactionType
  - valueDate
properties:
  accountServicerReference:
    type: string
    description: |
      Unique reference for the entry, assigned by the financial institution. This value is used as `entryId` in the transactions detail endpoint 
      `/accounts/{accountId}/transactions/{entryId}` to query the details of this entry. Corresponds to the attribute _Ntry ⇾ AcctSvcrRef_ in SPS/ISO-20022.
    example: 12345ABC6789
    maxLength: 35
  additionalEntryInformation:
    type: string
    description: |
      Additional entry information. Corresponds to the attribute _AddtlNtryInf_ in SPS/ISO-20022. This attribute is required in the Account API, while optional in SPS.
      Reason: Necessary for the multibanking use case. Ref: Issue#4.
    example: Online Shopping Visa Debit Card Nr. xxxx 1234
  amount:
    $ref: ./PaymentCurrencyAmount.yaml
  bankTransactionCode:
    $ref: ./AccountTransactionBankTransactionCode.yaml
  bookingDate:
    $ref: ../generic/Date.yaml
    description: The booking date of the transaction set by the bank. Corresponds to the attribute _BookgDt_ in SPS/ISO-20022.
  entryStatus:
    type: string
    enum:
      - booked
      - pending
    description: Indicates the status of an account movement. Corresponds to the attribute _Ntry ⇾ Sts ⇾ Cd_ in SPS/ISO-20022.
    example: booked
  transactionType:
    $ref: ./AccountTransactionTransactionType.yaml
  valueDate:
    $ref: ../generic/Date.yaml
    description: The value date of the transaction set by the bank. Corresponds to the attribute _ValDt_ in SPS/ISO-20022.
  entryReference:
    type: string
    description: Booking reference; format depends on booking type. Corresponds to NtryRef in SPS/ISO-20022.
    example: '10001628'
    maxLength: 35
  entryReferenceInternalId:
    type: string
    description: |
      Additional grouping criteria for business cases ISR and QR-IBAN. Contains the BISR-ID or first 6 characters of the QR reference.
    example: '123456'
    maxLength: 35
  instructedAmount:
    $ref: ./AccountTransactionInstructedAmount.yaml
  reversalIndicator:
    type: boolean
    description: |
      Indicates if the transaction is a reversing entry. Corresponds to the attribute _RvslInd_ in SPS/ISO-20022.
    example: true
  totalChargesAmount:
    $ref: ./AccountTransactionItemCharges.yaml
  transactions:
    type: array
    description: Specifies the transaction entries.
    items:
      $ref: ./AccountTransactionItem.yaml

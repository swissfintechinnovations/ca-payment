title: Payment Submission Request
description: The payment submission request object.
type: object
required:
  - bookingInstruction
  - debtorAccount
  - initiatingPartyId
  - messageId
  - requestedExecutionDate
  - transactions
properties:
  bookingInstruction:
    $ref: ./PaymentBookingInstruction.yaml
  debtorAccount:
    $ref: ./PaymentDebtorAccount.yaml
  initiatingPartyId:
    # description: The identifier of the third party provider (TPP) who created the payment instruction message derived from the OAuth 2.0 flow.
    $ref: ./InitiatingPartyId.yaml
  messageId:
    # description: The unique identifier of the the payment instruction message.
    $ref: ./MessageId.yaml
  requestedExecutionDate:
    $ref: ./RequestedExecutionDate.yaml
  transactions:
    type: array
    description: |
      List of credit transfer transaction information items. Corresponds to the attribute PmtInf ⇾ CdtTrfTxInf in SPS/ISO-20022.
    items:
      $ref: ./PaymentInstructionItem.yaml

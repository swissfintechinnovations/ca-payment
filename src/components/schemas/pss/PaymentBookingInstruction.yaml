title: Payment Booking Instruction
description: |
  Combined booking and advice instruction for the payment submission. Encodes the SPS attributes batch booking (PmtInf ⇾ BtchBookg),
  category purpose code (PmtInf ⇾ CtgyPurp ⇾ Cd, e.g. SALA for confidential salary payments) and advice steering (NOA, CND, CWD, SIA).
type: string
enum:
  - SINGLEBOOKING_SIA
  - SINGLEBOOKING_NOA
  - BATCHBOOKING_SALA_NOA
  - BATCHBOOKING_SALA_CND
  - BATCHBOOKING_NOA
  - BATCHBOOKING_CND
  - BATCHBOOKING_CWD
example: BATCHBOOKING_SALA_CND

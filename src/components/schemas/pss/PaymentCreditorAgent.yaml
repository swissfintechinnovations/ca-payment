description: The creditor agent of a payment.
type: object
properties:
  bicfi:
    type: string
    minLength: 8
    maxLength: 11
    description: |
      The bank identifier code (BIC) of the creditor agent of a payment. Corresponds to the attribute CdtrAgt ⇾ FinInstnId ⇾ BICFI in SPS/ISO-20022.
    example: DEUTDE5M101
  clearingSystemMemberIdentification:
    # description: The clearing system member identification of the creditor agend of a payment.
    $ref: ./CommonClearingSystemMemberIdentification.yaml

title: Payment Charge Bearer Method
description: |
  The payment charge bearer method, i.e. who is responsible for paying the transaction fees associated with a payment.
  Corresponds to the attribute CdtTrfTxInf ⇾ ChrgBr in SPS/ISO-20022.
type: string
enum:
  - DEBT
  - CRED
  - SHAR
  - SLEV
example: SHAR

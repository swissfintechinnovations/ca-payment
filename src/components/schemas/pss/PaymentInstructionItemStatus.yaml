title: Payment Instruction Item Status
description: The status of the payment instruction item.
type: object
required:
  - originalEndToEndId
  - originalInstructionId
  - statusCode
properties:
  originalEndToEndId:
    type: string
    maxLength: 35
    description: |
      The endToEndId of the original instruction item, as provided in the attribute endToEndId of the payment submission request.
      Corresponds to the attribute _TxInfAndSts ⇾ OrgnlEndToEndId_ in SPS/ISO-20022.
    example: ENDTOENDID-001
  originalInstructionId:
    type: string
    maxLength: 35
    description: |
      The unique identifier of the original instruction item, as provided in the attribute instructionId of the payment submission request.
      Corresponds to the attribute _TxInfAndSts ⇾ OrgnlInstrId_ in SPS/ISO-20022.
    example: INSTR-001
  statusCode:
    type: string
    description: |
      The status of the payment. Corresponds to the attribute _TxSts_ in SPS/ISO-20022. Possible status values are:
      - ACCC (accepted settlement completed, credit to the creditor account)
      - ACCP (accepted)
      - ACSC (accepted settlement completed, debit to the debtor account)
      - ACWC (accepted with change)
      - RJCT (rejected)
    enum:
      - ACCC
      - ACCP
      - ACSC
      - ACWC
      - RJCT
    example: RJCT
  reasonCode:
    type: string
    description: The reason code for the instruction item. Corresponds to the attribute TxInfAndSts ⇾ StsRsnInf ⇾ Rsn in SPS/ISO-20022.
    example: CURR
  reasonInformation:
    type: string
    maxLength: 105
    description: The reason information for the instruction item. Corresponds to the attribute TxInfAndSts ⇾ StsRsnInf ⇾ AddtlInf in SPS/ISO-20022.
    example: currency USD not allowed for payment type IBAN

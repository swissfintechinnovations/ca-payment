title: Payment Submission Status
description: The payment submission status.
type: object
required:
  - statusCode
properties:
  statusCode:
    type: string
    description: |
      The status of the payment. Corresponds to the attribute _GrpSts_ in SPS/ISO-20022. Possible status values are:
      - ACCC (accepted settlement completed, credit to the creditor account)
      - ACCP (accepted)
      - ACSC (accepted, settlement completed, debit to the debtor account)
      - ACSP (accepted, settlement in process)
      - ACTC (accepted technical validation)
      - ACWC (accepted with change)
      - PART (partially accepted)
      - PNDG (pending)
      - RCVD (received)
      - RJCT (rejected)
    enum:
      - ACCC
      - ACCP
      - ACSC
      - ACSP
      - ACTC
      - ACWC
      - PART
      - PNDG
      - RCVD
      - RJCT
    example: PART
  messageId:
    description: The unique identifier (UUID) of the payment instruction message.
    $ref: ./MessageId.yaml
  transactions:
    type: array
    description: The payment transaction items.
    items:
      $ref: ./PaymentInstructionItemStatus.yaml

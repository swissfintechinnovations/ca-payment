title: Payment Debtor Account
description: IBAN of the debtor account. PSS restricts debtor accounts to IBAN. Corresponds to the attribute _PmtInf ⇾ DbtrAcct ⇾ Id ⇾ IBAN_ in SPS/ISO-20022.
type: object
required:
  - identification
  - type
properties:
  identification:
    type: string
    maxLength: 34
    pattern: ^[A-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}$
    description: |
      IBAN of the debtor account. PSS restricts debtor accounts to IBAN. Corresponds to the attribute _PmtInf ⇾ DbtrAcct ⇾ Id ⇾ IBAN_ in
      SPS/ISO-20022.
    example: CH5481230000001998736
  type:
    type: string
    description: The account identification type. The debtor account must always be an IBAN.
    enum:
      - IBAN
    example: IBAN

title: Requested Execution Date
description: |
  The requested execution date of the payment. In some cases, the financial institution can/will change this date, if the requested date
  is a bank / post holiday. Corresponds to the attribute _PmtInf ⇾ ReqdExctnDt_ in SPS/ISO-20022.
type: string
format: date
example: '2018-04-13'

title: Payment Instructed Amount
description: |
  The amount and currency of the payment instruction. Corresponds to the attribute _CdtTrfTxInf ⇾ Amt ⇾ InstdAmt_ in SPS/ISO-20022.
type: object
required:
  - amount
  - currency
properties:
  amount:
    $ref: ../generic/Amount.yaml
    # description: The amount of the payment instruction. Corresponds to the value of _CdtTrfTxInf ⇾ Amt ⇾ InstdAmt_ in SPS/ISO-20022.
  currency:
    $ref: ../generic/Currency.yaml
    # description: The currency of the payment instruction amount. Corresponds to the attribute _@Ccy_ of _CdtTrfTxInf ⇾ Amt ⇾ InstdAmt_.

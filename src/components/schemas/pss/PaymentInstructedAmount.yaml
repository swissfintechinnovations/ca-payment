title: Payment Instructed Amount
description: |
  The amount and currency of the payment instruction. Corresponds to the attribute _CdtTrfTxInf ⇾ Amt ⇾ InstdAmt_ in SPS/ISO-20022.
type: object
required:
  - amount
  - currency
properties:
  amount:
    $ref: ../generic/Amount.yaml
    # description: The amount of the payment instruction. Corresponds to the value of _CdtTrfTxInf ⇾ Amt ⇾ InstdAmt_ in SPS/ISO-20022.
  currency:
    $ref: ../generic/Currency.yaml
    # description: The currency of the payment instruction amount, expressed as a three-letter ISO 4217 code. Corresponds to the XML attribute @ccy on 
    CdtTrfTxInf ⇾ Amt ⇾ InstdAmt in SPS/ISO-20022, where the currency is carried as an attribute on the amount element rather than as a separate field.

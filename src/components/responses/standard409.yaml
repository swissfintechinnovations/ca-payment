headers:
  Content-Language:
    $ref: ../headers/Content-Language.yaml
  X-Correlation-ID:
    $ref: ../headers/X-Correlation-ID.yaml
description: |
  there was a conflict when creating the subscription. e.g., it already exists for the same api and version.
content:
  application/problem+json:
    schema:
      $ref: ../schemas/CommonErrorResponse.yaml
    example:
      type: /problems/SUBSCRIPTION_ALREADY_EXISTS
      title: resource not found
      detail: A subscription for the requested api and version already exists and cannot be created again
      instance: path/to/corresponding/resource
